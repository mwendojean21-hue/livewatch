<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Livewatch</title>
  <script>
    // Filet de sécurité si le rewrite SPA de vercel.json n'est pas appliqué
    // pour une raison quelconque (config multi-services inhabituelle) :
    // technique classique "spa-github-pages" — on mémorise le chemin demandé
    // puis on redirige vers "/", où main.tsx le restaure avant que React
    // Router ne prenne la main. Sans ça, un rafraîchissement sur une route
    // profonde (ex: /watch/external/xxx) renvoyait un vrai 404 Vercel.
    sessionStorage.setItem('lw_redirect_path', location.pathname + location.search + location.hash)
    location.replace('/')
  </script>
</head>
<body></body>
</html>
