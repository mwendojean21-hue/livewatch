databases:
  - name: livewatch-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  # ---- Backend : FastAPI (Livewatch.py) ----
  - type: web
    name: livewatch-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn Livewatch:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: livewatch-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false   # à définir après coup : l'URL du service frontend ci-dessous

  # ---- Frontend : React + Vite (livewatch-frontend) ----
  - type: web
    name: livewatch-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # à définir après coup : l'URL du service backend ci-dessus
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
